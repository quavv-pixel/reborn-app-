name: Deploy to GitHub Pages

# Manual only. The live site is on Vercel; this optional GitHub Pages copy
# failed on every merge because Pages isn't switched on for this repo (that
# needs a repo admin: Settings -> Pages -> Source -> GitHub Actions). Once it's
# on, run this from Actions -> "Deploy to GitHub Pages" -> Run workflow, or
# add `push: branches: [main]` back under `on:` to deploy on every merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new push cancels an in-flight one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      # enablement: true creates the Pages site itself (source: GitHub
      # Actions) if it doesn't exist yet — the default (false) only reads
      # the existing config and 404s on a repo that's never had Pages set up.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
