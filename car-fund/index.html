<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<meta name="description" content="Weekly savings tracker toward a car fund — pay, budget, and goal are all editable.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Car Fund">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Car Fund Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --gold: #B8862E; --gold2: #D4A24E; --gold3: #8C6A24;
  --bg: #F6F3EC; --bg2: #FFFFFF; --bg3: #FBF9F4;
  --surface: #FFFFFF; --surface2: #FBF5E8;
  --border: #E7E1D2; --border2: #EFEAE0;
  --text: #2B2620; --muted: #756E5E; --dim: #A79E8A; --dead: #CBC2AC;
  --red: #C2483F; --green: #2F8F5B; --blue: #3E72B0; --purple: #7D5FA8; --orange: #C87A2E;
  --shadow-sm: 0 1px 2px rgba(43,38,32,0.05), 0 1px 3px rgba(43,38,32,0.04);
  --shadow-md: 0 2px 6px rgba(43,38,32,0.06), 0 6px 16px rgba(43,38,32,0.05);
}
html { height:-webkit-fill-available; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Space Mono',monospace; overflow-x:hidden; overscroll-behavior:none; }
body { min-height:100vh; min-height:-webkit-fill-available; }
::-webkit-scrollbar { display:none; }

@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.06)} 70%{transform:scale(0.97)} 100%{transform:scale(1)} }
@keyframes pulse-gold { 0%,100%{box-shadow:0 0 0 0 rgba(184,134,46,0.28)} 50%{box-shadow:0 0 0 6px rgba(184,134,46,0)} }
@keyframes celebrate { 0%{opacity:0;transform:translateY(0) scale(0.5)} 60%{opacity:1;transform:translateY(-40px) scale(1.1)} 100%{opacity:0;transform:translateY(-70px) scale(0.9)} }

.gold-text { color:var(--gold); }
.confetti { position:fixed; pointer-events:none; z-index:9999; font-size:22px; animation:celebrate 1s ease forwards; }

#app { display:flex; flex-direction:column; height:100vh; height:-webkit-fill-available; height:100dvh; max-width:430px; margin:0 auto; overflow:hidden; }

/* HEADER */
/* #header is the first thing in #app now (the ticker banner was dropped —
   it ate space and read as a cheap marquee effect), so it's what needs to
   clear the notch/status bar. Kept compact: the old header alone used to
   run ~380px before the list even started. */
#header {
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
  position:relative; overflow:hidden; flex-shrink:0;
}
.corner-mark { position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); right:18px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--dim); }
.header-inner { position:relative; }
.eyebrow { display:flex; align-items:center; gap:8px; font-size:9px; letter-spacing:3px; color:var(--gold3); text-transform:uppercase; margin-bottom:8px; padding-right:96px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eyebrow::before { content:''; width:16px; height:1px; background:var(--gold); }
.title-line1 { font-family:'Syne',sans-serif; font-weight:800; font-size:24px; letter-spacing:0.3px; line-height:1.05; color:var(--text); }
.title-line2 { font-family:'Syne',sans-serif; font-weight:800; font-size:24px; letter-spacing:0.3px; line-height:1.05; }
.hero-number-wrap { display:flex; align-items:baseline; gap:5px; margin:10px 0 12px; }
.hero-dollar { font-family:'Syne',sans-serif; font-weight:800; font-size:15px; color:var(--gold); opacity:0.75; margin-top:2px; }
.hero-number { font-family:'Syne',sans-serif; font-weight:800; font-size:40px; letter-spacing:-0.5px; line-height:1; color:var(--gold); }
.hero-denom { font-size:10px; color:var(--dim); align-self:flex-end; padding-bottom:6px; letter-spacing:1px; }

/* PROGRESS */
.prog-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.prog-label { font-size:9px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
.prog-pct { font-size:13px; font-weight:700; color:var(--gold); }
.prog-track { height:6px; background:var(--border2); border-radius:3px; overflow:hidden; margin-bottom:11px; }
.prog-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--gold3),var(--gold),var(--gold2)); transition:width 1s cubic-bezier(0.34,1.56,0.64,1); }

/* STATS */
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 8px; text-align:center; position:relative; overflow:hidden; box-shadow:var(--shadow-sm); }
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--border2); }
.stat-card.gold-top::before { background:linear-gradient(90deg,var(--gold3),var(--gold)); }
.stat-label { font-size:8px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:3px; }
.stat-value { font-family:'Space Mono',monospace; font-weight:700; font-size:15px; color:var(--gold); letter-spacing:0; line-height:1.2; }
.stat-sub { font-size:8px; color:var(--dim); margin-top:2px; }
.stat-on-track { color:var(--green) !important; }
.stat-off-track { color:var(--red) !important; }

/* TABS */
#tabs { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; position:sticky; top:0; z-index:10; }
.tab-btn { flex:1; padding:13px 0; background:none; border:none; cursor:pointer; font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; transition:color 0.2s,border-color 0.2s; }
.tab-btn.active { color:var(--gold3); border-bottom-color:var(--gold); }
.tab-btn:focus-visible, .week-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* CONTENT */
#content { flex:1; padding:16px 14px 80px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; touch-action:pan-y; }
.section-label { font-size:8px; color:var(--dim); letter-spacing:3px; text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.section-label::after { content:''; flex:1; height:1px; background:var(--border2); }

/* WEEK CARDS */
.week-card {
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 14px; margin-bottom:6px; border-radius:12px; cursor:pointer;
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm);
  transition:background 0.2s,border-color 0.2s,transform 0.15s,box-shadow 0.2s;
  user-select:none; -webkit-user-select:none;
  animation:fadeUp 0.2s ease both; position:relative; overflow:hidden;
}
.week-card.current-week { border-color:var(--gold); box-shadow:var(--shadow-md); }
.week-card.current-week::before { content:'NOW'; position:absolute; top:0; right:0; background:var(--gold); color:#fff; font-size:7px; font-weight:700; letter-spacing:2px; padding:2px 7px; border-radius:0 11px 0 8px; font-family:'Space Mono',monospace; }
.week-card.checked { background:var(--surface2); border-color:rgba(184,134,46,0.35); }
.week-card.future { opacity:0.5; }
.week-card:active { transform:scale(0.98); }
.week-card.popping { animation:pop 0.35s ease; }
.week-left { display:flex; align-items:center; gap:12px; }
.checkbox { width:24px; height:24px; border-radius:7px; flex-shrink:0; border:2px solid var(--border2); background:transparent; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; transition:all 0.2s ease; }
.checkbox.checked { background:var(--gold); border-color:var(--gold); animation:pulse-gold 0.5s ease; }
.week-num { font-family:'Space Mono',monospace; font-weight:700; font-size:16px; color:var(--dead); line-height:1; width:30px; text-align:center; flex-shrink:0; transition:color 0.2s; }
.week-num.checked { color:var(--gold); }
.week-info .week-title { font-size:11px; color:var(--muted); font-weight:700; transition:color 0.2s; letter-spacing:0.3px; }
.week-info .week-title.checked { color:var(--text); }
.week-info .week-sub { font-size:9px; color:var(--dim); margin-top:2px; transition:color 0.2s; }
.week-info .week-sub.checked { color:var(--gold3); }
.week-right { text-align:right; }
.week-total { font-family:'Space Mono',monospace; font-weight:700; font-size:14px; color:var(--dead); transition:color 0.2s; }
.week-total.checked { color:var(--gold); }
.week-total-label { font-size:7px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
.goal-divider { text-align:center; padding:9px 0; margin:10px 0; font-family:'Space Mono',monospace; font-weight:700; font-size:10px; letter-spacing:3px; color:var(--gold3); text-transform:uppercase; border-top:1px dashed var(--border); border-bottom:1px dashed var(--border); background:var(--bg3); border-radius:6px; }
.empty-hint { font-size:11px; color:var(--muted); line-height:1.7; text-align:center; padding:30px 10px; }

/* BREAKDOWN */
.income-hero { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 18px; margin-bottom:16px; position:relative; overflow:hidden; text-align:center; box-shadow:var(--shadow-md); }
.income-label { font-size:9px; color:var(--dim); letter-spacing:3px; text-transform:uppercase; margin-bottom:6px; position:relative; }
.income-amount { font-family:'Syne',sans-serif; font-weight:800; font-size:48px; color:var(--gold); letter-spacing:-0.5px; line-height:1; position:relative; }
.income-sub { font-size:9px; color:var(--dim); margin-top:6px; letter-spacing:0.5px; position:relative; }
.income-tag { display:inline-block; margin-top:10px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:9px; color:var(--gold3); letter-spacing:1px; position:relative; }

.tax-row { display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 14px; margin-bottom:7px; box-shadow:var(--shadow-sm); }
.tax-label { font-size:10px; color:var(--muted); }
.tax-val { font-size:13px; font-weight:700; }

.breakdown-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.breakdown-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px 13px; position:relative; overflow:hidden; box-shadow:var(--shadow-sm); }
.breakdown-icon { font-size:20px; margin-bottom:8px; }
.breakdown-name { font-size:9px; color:var(--dim); letter-spacing:1px; margin-bottom:5px; text-transform:uppercase; }
.breakdown-amount { font-family:'Space Mono',monospace; font-weight:700; font-size:19px; letter-spacing:0; line-height:1; }
.breakdown-pct { font-size:8px; color:var(--dim); margin-top:3px; }
.bar-mini { height:3px; background:var(--border2); border-radius:2px; margin-top:9px; overflow:hidden; }
.bar-mini-fill { height:100%; border-radius:2px; transition:width 1s cubic-bezier(0.34,1.56,0.64,1); }

.after-car-card { background:var(--surface2); border:1px dashed rgba(47,143,91,0.35); border-radius:13px; padding:16px 14px; margin-top:4px; }
.after-car-title { font-size:9px; letter-spacing:2px; color:var(--green); text-transform:uppercase; margin-bottom:10px; }
.after-car-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--border2); }
.after-car-row:last-child { border-bottom:none; }
.after-car-label { font-size:10px; color:var(--muted); }
.after-car-val { font-size:13px; font-weight:700; }

/* MILESTONES */
.milestone-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:16px 14px; margin-bottom:10px; transition:all 0.3s ease; animation:fadeUp 0.25s ease both; box-shadow:var(--shadow-sm); }
.milestone-card.reached { background:var(--surface2); border-color:rgba(184,134,46,0.35); }
.milestone-card.next { border-color:var(--gold); box-shadow:var(--shadow-md); }
.milestone-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.milestone-emoji { font-size:24px; margin-right:10px; }
.milestone-name { font-family:'Syne',sans-serif; font-size:14px; color:var(--text); font-weight:700; }
.milestone-name.reached { color:var(--gold3); }
.milestone-date { font-size:9px; color:var(--dim); margin-top:3px; letter-spacing:1px; }
.milestone-right { text-align:right; flex-shrink:0; }
.milestone-amount { font-family:'Space Mono',monospace; font-weight:700; font-size:17px; color:var(--dead); letter-spacing:0; }
.milestone-amount.reached { color:var(--gold); }
.milestone-badge { display:inline-block; background:rgba(47,143,91,0.12); border:1px solid rgba(47,143,91,0.35); color:var(--green); font-size:8px; letter-spacing:2px; padding:2px 8px; border-radius:20px; margin-top:4px; text-transform:uppercase; }
.milestone-togo { font-size:9px; color:var(--dim); margin-top:8px; }
.milestone-bar { height:4px; background:var(--border2); border-radius:2px; overflow:hidden; }
.milestone-bar-fill { height:100%; border-radius:2px; transition:width 1s cubic-bezier(0.34,1.56,0.64,1); }

.pace-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.pace-title { font-size:9px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
.pace-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; }
.pace-row + .pace-row { border-top:1px solid var(--border2); }
.pace-label { font-size:10px; color:var(--muted); }
.pace-val { font-size:12px; font-weight:700; }

.rules-wrap { margin-top:4px; }
.rule-item { display:flex; gap:12px; padding:13px 0; align-items:flex-start; border-bottom:1px solid var(--border2); animation:fadeUp 0.2s ease both; }
.rule-item:last-child { border-bottom:none; }
.rule-icon { font-size:18px; flex-shrink:0; }
.rule-text { font-size:11px; color:var(--muted); line-height:1.6; }
.rule-text strong { color:var(--gold3); font-weight:700; }

.footer-wrap { margin-top:20px; padding:22px 14px; text-align:center; background:var(--surface); border-radius:16px; border:1px solid var(--border); position:relative; overflow:hidden; box-shadow:var(--shadow-md); }
.footer-line1 { font-family:'Syne',sans-serif; font-weight:800; font-size:24px; letter-spacing:0; position:relative; }
.footer-line2 { font-family:'Syne',sans-serif; font-weight:800; font-size:20px; letter-spacing:0; color:var(--dead); margin-top:-2px; position:relative; }
.footer-date { font-size:9px; color:var(--dim); margin-top:10px; letter-spacing:1px; position:relative; }

#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); border:1px solid var(--text); color:var(--bg2); font-size:11px; padding:9px 18px; border-radius:30px; opacity:0; transition:all 0.3s ease; z-index:1000; white-space:nowrap; pointer-events:none; box-shadow:var(--shadow-md); }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.safe-bottom { height:max(env(safe-area-inset-bottom),16px); flex-shrink:0; }

/* SETTINGS (same label-over-input, titled-panel format as the REBORN app's Budget/Goal editors) */
.panel { background:var(--surface); border:1px solid var(--border); border-radius:13px; margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm); }
.panel-head { padding:10px 14px; border-bottom:1px solid var(--border); font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); }
.panel-body { padding:14px; }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field { display:flex; flex-direction:column; }
.field-label { font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
.field-input { background:var(--bg3); border:1px solid var(--border); color:var(--text); font-family:'Space Mono',monospace; font-size:13px; padding:9px 10px; border-radius:8px; width:100%; }
.field-input:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,134,46,0.14); }
.field-input::-webkit-inner-spin-button { opacity:0.6; }
.field-hint { font-size:9px; color:var(--dim); margin-top:10px; line-height:1.6; }
.reset-btn { width:100%; margin-top:2px; background:transparent; border:1px solid var(--red); color:var(--red); font-family:'Space Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:11px; border-radius:10px; cursor:pointer; }
.reset-btn:active { transform:scale(0.98); }
.autosave-note { text-align:center; margin-top:12px; }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="corner-mark" id="corner-date">—</div>
    <div class="header-inner">
      <div class="eyebrow" id="eyebrow-text">Loading…</div>
      <div class="title-line1">Car Fund</div>
      <div class="title-line2"><span class="gold-text">Tracker</span></div>
      <div class="hero-number-wrap">
        <div class="hero-dollar">$</div>
        <div class="hero-number" id="hero-num">0</div>
        <div class="hero-denom" id="hero-denom">/ $0</div>
      </div>
      <div class="prog-header">
        <span class="prog-label">Progress to car</span>
        <span class="prog-pct" id="prog-pct-label">0%</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="stats-row">
        <div class="stat-card gold-top">
          <div class="stat-label">Saved</div>
          <div class="stat-value" id="stat-saved">$0</div>
          <div class="stat-sub" id="stat-saved-sub">of $0 goal</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Wks Left</div>
          <div class="stat-value" id="stat-weeks">0</div>
          <div class="stat-sub" id="stat-weeks-sub">0 saved</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Status</div>
          <div class="stat-value" id="stat-track">—</div>
          <div class="stat-sub" id="stat-sub2">tap to track</div>
        </div>
      </div>
    </div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="tracker" onclick="switchTab('tracker')">⬜ TRACK</button>
    <button class="tab-btn" data-tab="breakdown" onclick="switchTab('breakdown')">💰 MONEY</button>
    <button class="tab-btn" data-tab="milestones" onclick="switchTab('milestones')">🏁 GOALS</button>
    <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙ SETUP</button>
  </div>

  <div id="content"></div>
  <div class="safe-bottom"></div>
</div>
<div id="toast"></div>

<script>
// ── DEFAULTS / SETTINGS ─────────────────────────────────
// Every number on this page is editable from the Setup tab. Nothing here is
// hardcoded into the render functions — they all read from STATE.D, which
// recompute() rebuilds from STATE.S (the user's saved settings) any time a
// field changes. Defaults match the original plan so existing users see no
// change until they actually edit something.
const DEFAULTS = {
  gross: 770,
  taxRate: 20,     // percent
  savings: 250,
  bills: 200,
  rides: 80,
  food: 70,
  goal: 5000,
  debtAmt: 410,
  startDate: "2026-06-17",
};

const STATE = { S: loadSettings(), D: null };

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem("cf_settings"));
    return { ...DEFAULTS, ...(saved && typeof saved === "object" ? saved : {}) };
  } catch (e) { return { ...DEFAULTS }; }
}
function saveSettings() {
  try { localStorage.setItem("cf_settings", JSON.stringify(STATE.S)); } catch (e) {}
}

const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtMoney = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString();

// ── DERIVE EVERYTHING FROM SETTINGS ─────────────────────
function buildMilestones({ HAS_DEBT, DEBT_AMT, DEBT_WEEK, GOAL, SAVINGS, SAVE_WEEKS, SAVE_START }) {
  const list = [];
  if (HAS_DEBT) list.push({ label:"Debt Gone", target:DEBT_AMT, weekIdx:DEBT_WEEK, emoji:"💳", color:"#C2483F", isDebt:true });
  if (SAVINGS > 0 && SAVE_WEEKS > 0) {
    const fracs = [
      { label:"First Month",    frac:0.20, emoji:"🌱", color:"#2F8F5B" },
      { label:"Halfway",        frac:0.50, emoji:"⚡", color:"#C87A2E" },
      { label:"Start Shopping", frac:0.90, emoji:"🔍", color:"#3E72B0" },
      { label:"Car Budget",     frac:1.00, emoji:"🎯", color:"#B8862E" },
    ];
    const seenWeeks = new Set();
    fracs.forEach(f => {
      let wk = Math.ceil((GOAL * f.frac) / SAVINGS);
      wk = Math.min(Math.max(wk, 1), SAVE_WEEKS);
      const weekIdx = SAVE_START + wk - 1;
      if (seenWeeks.has(weekIdx)) return; // dedupe when weeks are too few to space fractions apart
      seenWeeks.add(weekIdx);
      list.push({ label:f.label, target: wk * SAVINGS, weekIdx, emoji:f.emoji, color:f.color });
    });
  }
  return list;
}

function buildRules({ SAVINGS, WEEKDAY_NAME, RIDES, MILESTONES }) {
  const rules = [
    { text:"<strong>Zero eating out</strong> — until the car is funded", icon:"🚫" },
    { text:`Move <strong>${fmtMoney(SAVINGS)} every ${WEEKDAY_NAME}</strong> — no skipping`, icon:"📅" },
    { text:"Car fund is <strong>untouchable</strong>", icon:"🔒" },
  ];
  const shopping = MILESTONES.find(m => m.label === "Start Shopping");
  if (shopping) rules.push({ text:`Start shopping at <strong>${fmtMoney(shopping.target)}</strong>`, icon:"🔍" });
  rules.push({ text:`After the car: <strong>${fmtMoney(RIDES)}/wk rides freed up</strong> → apartment fund`, icon:"🏠" });
  return rules;
}

function recompute() {
  const S = STATE.S;
  const GROSS    = Math.max(0, Number(S.gross) || 0);
  const TAX_RATE = Math.min(100, Math.max(0, Number(S.taxRate) || 0)) / 100;
  const TAX      = Math.round(GROSS * TAX_RATE);
  const INCOME   = GROSS - TAX;
  const SAVINGS  = Math.max(0, Number(S.savings) || 0);
  const BILLS    = Math.max(0, Number(S.bills) || 0);
  const RIDES    = Math.max(0, Number(S.rides) || 0);
  const FOOD     = Math.max(0, Number(S.food) || 0);
  const LEFT     = INCOME - SAVINGS - BILLS - RIDES - FOOD;
  const GOAL     = Math.max(0, Number(S.goal) || 0);
  const DEBT_AMT = Math.max(0, Number(S.debtAmt) || 0);
  const HAS_DEBT = DEBT_AMT > 0;

  const SAVE_WEEKS = SAVINGS > 0 ? Math.max(1, Math.ceil(GOAL / SAVINGS)) : 0;
  const DEBT_WEEK  = 0;
  const SAVE_START = HAS_DEBT ? 1 : 0;
  const TOTAL_WEEKS = SAVE_START + SAVE_WEEKS;

  let startDate = new Date((S.startDate || DEFAULTS.startDate) + "T12:00:00");
  if (isNaN(startDate.getTime())) startDate = new Date(DEFAULTS.startDate + "T12:00:00");
  const WEEKDAY_NAME = startDate.toLocaleDateString("en-US", { weekday: "long" });

  const WEDNESDAYS = [];
  { let d = new Date(startDate);
    const count = Math.max(TOTAL_WEEKS, 1);
    for (let i = 0; i < count; i++) { WEDNESDAYS.push(new Date(d)); d.setDate(d.getDate() + 7); } }

  const BREAKDOWN = [
    { label:"Car Savings", amount:SAVINGS, color:"#B8862E", icon:"🚗", desc:"locked away" },
    { label:"Bills",       amount:BILLS,   color:"#C2483F", icon:"🏠", desc:"non-negotiable" },
    { label:"Rides",       amount:RIDES,   color:"#3E72B0", icon:"🚕", desc:"until you drive" },
    { label:"Food",        amount:FOOD,    color:"#2F8F5B", icon:"🍗", desc:"groceries only" },
    { label:"Left Over",   amount:LEFT,    color:LEFT < 0 ? "#C2483F" : "#C87A2E", icon:"💵", desc:LEFT < 0 ? "over budget" : "buffer" },
  ];

  const MILESTONES = buildMilestones({ HAS_DEBT, DEBT_AMT, DEBT_WEEK, GOAL, SAVINGS, SAVE_WEEKS, SAVE_START });
  const RULES = buildRules({ SAVINGS, WEEKDAY_NAME, RIDES, MILESTONES });
  const totalWeeksSpan = TOTAL_WEEKS || 1;
  const months = Math.max(1, Math.round(totalWeeksSpan / 4.345));

  STATE.D = {
    GROSS, TAX_RATE, TAX, INCOME, SAVINGS, BILLS, RIDES, FOOD, LEFT, GOAL, DEBT_AMT, HAS_DEBT,
    SAVE_WEEKS, DEBT_WEEK, SAVE_START, TOTAL_WEEKS, WEDNESDAYS, WEEKDAY_NAME, BREAKDOWN, MILESTONES, RULES, months,
  };
}

let checkedWeeks = {}, currentTab = "tracker";
try { checkedWeeks = JSON.parse(localStorage.getItem("cf_weeks2") || "{}"); } catch(e){}

// ── STATS ─────────────────────────────────────────────
function getStats() {
  const D = STATE.D;
  const allChecked = Object.entries(checkedWeeks).filter(([,v])=>v);
  const savingsDone = allChecked.filter(([k])=>parseInt(k)>=D.SAVE_START).length;
  const saved = savingsDone * D.SAVINGS;
  const debtCleared = D.HAS_DEBT ? !!checkedWeeks[D.DEBT_WEEK] : true;
  const pct = D.GOAL > 0 ? Math.min((saved/D.GOAL)*100, 100) : 0;
  const today = new Date();
  const cwi = D.WEDNESDAYS.findIndex((d,i) => {
    const next = D.WEDNESDAYS[i+1];
    return today >= d && (!next || today < next);
  });
  const expectedDone = cwi >= D.SAVE_START ? cwi - D.SAVE_START + 1 : 0;
  const onTrack = savingsDone >= expectedDone;
  return { savingsDone, saved, pct, left: Math.max(0, D.SAVE_WEEKS - savingsDone), onTrack, cwi, debtCleared };
}

function getCurrentWeekIdx() {
  const D = STATE.D;
  const today = new Date();
  for (let i = D.WEDNESDAYS.length-1; i >= 0; i--) {
    if (today >= D.WEDNESDAYS[i]) return i;
  }
  return -1;
}

  const D = STATE.D;

  if (D.HAS_DEBT && !debtCleared && savingsDone === 0) {

// Tracks one in-flight interval per element id so rapid toggles don't spawn
// overlapping intervals that race each other and leave the number stuck.
const numberAnimations = {};
function animateNumber(id, target) {
  const el = document.getElementById(id); if(!el) return;
  if (numberAnimations[id]) clearInterval(numberAnimations[id]);
  const current = parseInt(el.textContent.replace(/,/g,"")) || 0;
  if (current === target) return;
  const diff = target - current, steps = 20; let step = 0;
  numberAnimations[id] = setInterval(() => {
    step++;
    el.textContent = Math.round(current + diff*step/steps).toLocaleString();
    if (step >= steps) {
      el.textContent = target.toLocaleString();
      clearInterval(numberAnimations[id]);
      delete numberAnimations[id];
    }
  }, 25);
}

// ── CONFETTI / TOAST ──────────────────────────────────
function spawnConfetti(x, y) {
  ["🎉","✨","💰","🚗","⭐","🏆"].forEach((e,i) => {
    const el = document.createElement("div");
    el.className = "confetti"; el.textContent = e;
    el.style.left = (x + Math.random()*60-30)+"px";
    el.style.top  = (y-10)+"px";
    el.style.animationDelay = (i*0.06)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1500);
  });
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  document.getElementById("content").scrollTop = 0;

// ── TOGGLE ────────────────────────────────────────────
function toggleWeek(i, event) {
  checkedWeeks[i] = !checkedWeeks[i];
  save(); updateHeader();
  const card = document.querySelector(`[data-week="${i}"]`); if(!card) return;
  const checked = checkedWeeks[i];
  card.classList.toggle("checked", checked);
  card.classList.add("popping");
  card.setAttribute("aria-checked", checked ? "true" : "false");
  setTimeout(()=>card.classList.remove("popping"), 400);
  card.querySelector(".checkbox").classList.toggle("checked", checked);
  card.querySelector(".checkbox").textContent = checked ? "✓" : "";
  card.querySelector(".week-num").classList.toggle("checked", checked);
  card.querySelector(".week-title").classList.toggle("checked", checked);
  card.querySelector(".week-sub").classList.toggle("checked", checked);
  const wtEl = card.querySelector(".week-total");
  if (wtEl) wtEl.classList.toggle("checked", checked);
  const D = STATE.D;
  if (checked) {
    const rect = card.getBoundingClientRect();
    spawnConfetti(rect.left+rect.width/2, rect.top+20);
    if (D.HAS_DEBT && i === D.DEBT_WEEK) {
      showToast(`🎉 ${fmtMoney(D.DEBT_AMT)} debt cleared! Savings start now!`);
    } else {
      const {saved} = getStats();
      showToast("💰 " + fmtMoney(saved) + " saved so far!");
    }
  } else {
    showToast((D.HAS_DEBT && i === D.DEBT_WEEK ? "Debt week" : "Week " + i) + " unchecked");
  }
}

function onWeekKeydown(event, i) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleWeek(i, event);
  }
}
window.onWeekKeydown = onWeekKeydown;

function renderTracker() {
  const D = STATE.D;
  const cwi = getCurrentWeekIdx();

  let html = `<div class="section-label">Tap each ${D.WEEKDAY_NAME} when done</div>`;

  if (D.HAS_DEBT) {
    const debtChecked = !!checkedWeeks[D.DEBT_WEEK];
    const isCurrDebt = cwi === D.DEBT_WEEK;
    html += `
      <div class="goal-divider" style="color:var(--red);border-color:rgba(194,72,63,0.3);background:rgba(194,72,63,0.05)">
        🔴 ${fmt(D.WEDNESDAYS[D.DEBT_WEEK])} — Pay Off ${fmtMoney(D.DEBT_AMT)} Credit Card
      </div>
      <div class="week-card ${debtChecked?"checked":""} ${isCurrDebt&&!debtChecked?"current-week":""}"
           data-week="0" tabindex="0" role="checkbox" aria-checked="${debtChecked}" aria-label="Debt payoff week"
           onclick="toggleWeek(0,event)" onkeydown="onWeekKeydown(event,0)"
           style="border-color:${debtChecked?"rgba(47,143,91,0.35)":"rgba(194,72,63,0.3)"}">
        <div class="week-left">
          <div class="checkbox ${debtChecked?"checked":""}" style="${!debtChecked?"border-color:var(--red)":""}">${debtChecked?"✓":""}</div>
          <div class="week-num ${debtChecked?"checked":""}" style="${!debtChecked?"color:var(--red)":""}">00</div>
          <div class="week-info">
            <div class="week-title ${debtChecked?"checked":""}" style="${!debtChecked?"color:var(--red)":""}">${fmt(D.WEDNESDAYS[D.DEBT_WEEK])} · Debt Cleared</div>
            <div class="week-sub ${debtChecked?"checked":""}">${fmtMoney(D.DEBT_AMT)} credit card → gone</div>
          </div>
        </div>
        <div class="week-right">
          <div class="week-total" style="color:${debtChecked?"var(--green)":"var(--red)"}">${debtChecked?"CLEAR ✓":"-"+fmtMoney(D.DEBT_AMT)}</div>
          <div class="week-total-label">debt payoff</div>
        </div>
      </div>
      <div class="goal-divider" style="margin-top:10px">💰 ${fmt(D.WEDNESDAYS[D.SAVE_START])} — Savings Begin (${fmtMoney(D.SAVINGS)}/wk)</div>`;
  }

  if (D.SAVINGS <= 0 || D.GOAL <= 0) {
    html += `<div class="empty-hint">Head to the <strong style="color:var(--gold)">Setup</strong> tab and enter a weekly savings amount and a goal to build your plan.</div>`;
    return html;
  }

  for (let i = D.SAVE_START; i < D.TOTAL_WEEKS; i++) {
    const sn = i - D.SAVE_START + 1;
    const running = sn * D.SAVINGS;
    const checked = !!checkedWeeks[i];
    const isCurr   = i === cwi;
    const isFuture = i > cwi + 1 && !checked;
    const isGoal   = running >= D.GOAL && (sn-1)*D.SAVINGS < D.GOAL;

    if (isGoal) html += `<div class="goal-divider">🎯 ${fmtMoney(D.GOAL)} Hit — Time to Buy</div>`;

    html += `
      <div class="week-card ${checked?"checked":""} ${isCurr&&!checked?"current-week":""} ${isFuture?"future":""}"
           data-week="${i}" tabindex="0" role="checkbox" aria-checked="${checked}" aria-label="Week ${sn}, ${fmt(D.WEDNESDAYS[i])}"
           onclick="toggleWeek(${i},event)" onkeydown="onWeekKeydown(event,${i})" style="animation-delay:${Math.min(i,20)*12}ms">
        <div class="week-left">
          <div class="checkbox ${checked?"checked":""}">${checked?"✓":""}</div>
          <div class="week-num ${checked?"checked":""}">${String(sn).padStart(2,"0")}</div>
          <div class="week-info">
            <div class="week-title ${checked?"checked":""}">${fmt(D.WEDNESDAYS[i])}</div>
            <div class="week-sub ${checked?"checked":""}">+${fmtMoney(D.SAVINGS)} → fund</div>
          </div>
        </div>
        <div class="week-right">
          <div class="week-total ${checked?"checked":""}">${fmtMoney(running)}</div>
          <div class="week-total-label">running total</div>
        </div>
      </div>`;
  }
  return html;
}

// ── RENDER MILESTONES ─────────────────────────────────
function renderMilestones() {
  const D = STATE.D;
  const { saved, savingsDone, left, debtCleared } = getStats();
  const weeksToGoal = D.SAVINGS > 0 ? Math.ceil(Math.max(0, D.GOAL - saved) / D.SAVINGS) : 0;
  const goalDateIdx = Math.min(D.SAVE_START + savingsDone + weeksToGoal - 1, D.TOTAL_WEEKS-1);
  const projDate = D.GOAL>0 && saved >= D.GOAL ? "DONE 🎉" : (D.SAVINGS>0 && weeksToGoal <= left ? fmt(D.WEDNESDAYS[Math.max(goalDateIdx,0)]) : "—");

  let html = `
    <div class="pace-card">
      <div class="pace-title">Pace Calculator</div>
      ${D.HAS_DEBT ? `<div class="pace-row"><span class="pace-label">Debt cleared</span><span class="pace-val" style="color:${debtCleared?"var(--green)":"var(--red)"}">${debtCleared?"YES ✓":fmt(D.WEDNESDAYS[D.DEBT_WEEK])}</span></div>` : ""}
      <div class="pace-row"><span class="pace-label">Savings weeks done</span><span class="pace-val" style="color:var(--gold3)">${savingsDone} of ${D.SAVE_WEEKS}</span></div>
      <div class="pace-row"><span class="pace-label">Total saved</span><span class="pace-val" style="color:var(--gold3)">${fmtMoney(saved)}</span></div>
      <div class="pace-row"><span class="pace-label">Weeks to ${fmtMoney(D.GOAL)}</span><span class="pace-val" style="color:var(--blue)">${D.GOAL>0 && saved>=D.GOAL?"DONE":weeksToGoal+" more"}</span></div>
      <div class="pace-row"><span class="pace-label">Projected goal date</span><span class="pace-val" style="color:var(--green)">${projDate}</span></div>
      <div class="pace-row"><span class="pace-label">Full plan total (${D.SAVE_WEEKS} wks)</span><span class="pace-val" style="color:var(--purple)">${fmtMoney(D.SAVE_WEEKS*D.SAVINGS)}</span></div>
    </div>
    <div class="section-label">Milestones</div>`;

  if (D.MILESTONES.length === 0) {
    html += `<div class="empty-hint">Set a weekly savings amount and a goal in <strong style="color:var(--gold)">Setup</strong> to see milestones here.</div>`;
  }

  D.MILESTONES.forEach(({label,target,emoji,color,isDebt,weekIdx},idx) => {
    const reached = isDebt ? debtCleared : saved >= target;
    const isNext  = !reached && (idx===0 || (D.MILESTONES[idx-1].isDebt ? debtCleared : saved >= D.MILESTONES[idx-1].target));
    const pct     = isDebt ? (debtCleared?100:0) : Math.min((saved/target)*100,100);
    const dateLabel = fmt(D.WEDNESDAYS[weekIdx]);
    html += `
      <div class="milestone-card ${reached?"reached":""} ${isNext?"next":""}" style="animation-delay:${idx*60}ms">
        <div class="milestone-top">
          <div style="display:flex;align-items:center">
            <span class="milestone-emoji">${emoji}</span>
            <div>
              <div class="milestone-name ${reached?"reached":""}">${label}</div>
              <div class="milestone-date">~${dateLabel}</div>
            </div>
          </div>
          <div class="milestone-right">
            <div class="milestone-amount ${reached?"reached":""}">${fmtMoney(target)}</div>
            ${reached?`<div class="milestone-badge">✓ Done</div>`:""}
          </div>
        </div>
        <div class="milestone-bar">
          <div class="milestone-bar-fill" style="width:${pct}%;background:${reached?color:color+"40"}"></div>
        </div>
        ${!reached?`<div class="milestone-togo">${isDebt?"Clear on "+dateLabel:fmtMoney(target-saved)+" to go · "+Math.round(pct)+"% there"}</div>`:""}
      </div>`;
  });

  html += `
    <div class="section-label">The Rules</div>
    <div class="rules-wrap">
      ${D.RULES.map((r,i)=>`<div class="rule-item" style="animation-delay:${i*50}ms"><span class="rule-icon">${r.icon}</span><span class="rule-text">${r.text}</span></div>`).join("")}
    </div>
    <div class="footer-wrap">
      <div class="footer-line1"><span class="gold-text">${D.months} Month${D.months===1?"":"s"}.</span></div>
      <div class="footer-line2">Then Your Car.</div>
      <div class="footer-date">${D.HAS_DEBT ? "Debt: "+fmt(D.WEDNESDAYS[D.DEBT_WEEK])+" · " : ""}Save: ${D.TOTAL_WEEKS>0?fmt(D.WEDNESDAYS[D.SAVE_START]):"—"} → ${D.TOTAL_WEEKS>0?fmt(D.WEDNESDAYS[D.TOTAL_WEEKS-1]):"—"}</div>
    </div>`;
  return html;
}

          <div class="field"><label class="field-label">Save / wk ($)</label><input class="field-input" type="number" inputmode="decimal" min="0" step="1" value="${S.savings}" oninput="onSettingInput('savings', this.value)"></div>
          <div class="field"><label class="field-label">Bills / wk ($)</label><input class="field-input" type="number" inputmode="decimal" min="0" step="1" value="${S.bills}" oninput="onSettingInput('bills', this.value)"></div>
          <div class="field"><label class="field-label">Rides / wk ($)</label><input class="field-input" type="number" inputmode="decimal" min="0" step="1" value="${S.rides}" oninput="onSettingInput('rides', this.value)"></div>
          <div class="field"><label class="field-label">Food / wk ($)</label><input class="field-input" type="number" inputmode="decimal" min="0" step="1" value="${S.food}" oninput="onSettingInput('food', this.value)"></div>
        </div>
        <div class="field-hint" id="pay-hint">${payHintHtml(D)}</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Goal</div>
      <div class="panel-body">
        <div class="field-grid">
          <div class="field"><label class="field-label">Goal amount ($)</label><input class="field-input" type="number" inputmode="decimal" min="0" step="1" value="${S.goal}" oninput="onSettingInput('goal', this.value)"></div>
          <div class="field"><label class="field-label">Start date</label><input class="field-input" type="date" value="${S.startDate}" oninput="onSettingInput('startDate', this.value)"></div>
        </div>
        <div class="field-hint" id="goal-hint">${goalHintHtml(D)}</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Debt payoff (optional, runs before savings)</div>
      <div class="panel-body">
        <div class="field-grid">
          <div class="field"><label class="field-label">Amount owed ($)</label><input class="field-input" type="number" inputmode="decimal" min="0" step="1" value="${S.debtAmt}" oninput="onSettingInput('debtAmt', this.value)"></div>
        </div>
        <div class="field-hint" id="debt-hint">${debtHintHtml(D)}</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetProgress()">Reset checked weeks</button>
    <div class="field-hint autosave-note">Everything above saves automatically on this device.</div>
  `;
}

function payHintHtml(D) {
  return `${fmtMoney(D.INCOME)} take-home − ${fmtMoney(D.SAVINGS)} save − ${fmtMoney(D.BILLS)} bills − ${fmtMoney(D.RIDES)} rides − ${fmtMoney(D.FOOD)} food = <strong style="color:${D.LEFT<0?'var(--red)':'var(--gold3)'}">${fmtMoney(D.LEFT)}</strong> left over.`;
}
function goalHintHtml(D) {
  return `Weeks run every <strong style="color:var(--gold3)">${D.WEEKDAY_NAME}</strong> starting from that date — ${D.SAVE_WEEKS} deposit${D.SAVE_WEEKS===1?"":"s"} of ${fmtMoney(D.SAVINGS)} to reach ${fmtMoney(D.GOAL)}.`;
}
function debtHintHtml(D) {
  return D.HAS_DEBT ? "The first week pays this off before any savings weeks start." : "Leave at 0 if you have no debt — the payoff week is skipped automatically.";
}

function onSettingInput(key, rawValue) {
  if (key === "startDate") {
    STATE.S[key] = rawValue || DEFAULTS.startDate;
  } else {
    STATE.S[key] = rawValue === "" ? 0 : Number(rawValue);
  }
  saveSettings();
  recompute();
  updateHeader();
  // Deliberately not calling renderContent() here: the Setup tab is what's
  // on screen while the user is typing, and re-rendering it would blow away
  // input focus and cursor position on every keystroke. Instead, patch just
  // the three hint lines in place — they're plain text, not inputs, so
  // there's no focus to lose. Other tabs pick up the new numbers normally
  // the next time they're switched to.
  const D = STATE.D;
  const payHint = document.getElementById("pay-hint");
  const goalHint = document.getElementById("goal-hint");
  const debtHint = document.getElementById("debt-hint");
  if (payHint) payHint.innerHTML = payHintHtml(D);
  if (goalHint) goalHint.innerHTML = goalHintHtml(D);
  if (debtHint) debtHint.innerHTML = debtHintHtml(D);
}

function resetProgress() {
  if (!confirm("Clear all checked weeks? This can't be undone.")) return;
  checkedWeeks = {};
  save();
  updateHeader();
  renderContent();
  showToast("Progress reset");
}
window.onSettingInput = onSettingInput;
window.resetProgress = resetProgress;

// ── RENDER ────────────────────────────────────────────
function renderContent() {
  const el = document.getElementById("content");
  if (currentTab==="tracker")         el.innerHTML = renderTracker();
  else if (currentTab==="breakdown")  el.innerHTML = renderBreakdown();
  else if (currentTab==="settings")   el.innerHTML = renderSettings();
  else                                el.innerHTML = renderMilestones();
}

// ── INIT ──────────────────────────────────────────────
recompute();
updateHeader();
renderContent();
document.getElementById("corner-date").textContent =
  new Date().toLocaleDateString("en-US",{month:"short",year:"numeric"}).toUpperCase();
</script>
</body>
</html>
