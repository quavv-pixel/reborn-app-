<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REBORN" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Fonts load here (non-render-blocking, display=swap) instead of via
         @import inside the app's JS, which stalled first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" />
    <title>REBORN</title>
    <style>
      /* The page must never show white behind the iOS status bar or on
         overscroll — JS re-tints this to the active theme once the app loads. */
      html, body { background: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Vercel Web Analytics + Speed Insights (injected at runtime by Vercel;
         appended via JS instead of a static tag so Vite's build doesn't try
         to resolve these as local assets — they only exist once deployed). -->
    <script>
      ['/_vercel/insights/script.js', '/_vercel/speed-insights/script.js'].forEach(src => {
        var s = document.createElement('script');
        s.defer = true;
        s.src = src;
        document.body.appendChild(s);
      });
    </script>
  </body>
</html>
