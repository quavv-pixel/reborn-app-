<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = solid bar with dark or light text chosen by the phone, so the
         clock/battery stay readable in both light and dark mode. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="REBORN" />
    <!-- Lets native controls (date pickers, scrollbars) follow light/dark too. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Browser/status bar color: one for light mode, one for dark mode. -->
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Home-screen icon on iPhone/iPad (iOS ignores the manifest icons) and the browser-tab icon. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!-- Fonts load here (non-render-blocking, display=swap) instead of via
         @import inside the app's JS, which stalled first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>REBORN</title>
    <style>
      /* Paint the right background before the app's code loads, so there's
         no white or black flash on open. Matches src/index.css. */
      html, body { background: #F6F4EF; }
      @media (prefers-color-scheme: dark) { html, body { background: #121412; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Vercel Web Analytics + Speed Insights (injected at runtime by Vercel;
         appended via JS instead of a static tag so Vite's build doesn't try
         to resolve these as local assets — they only exist once deployed). -->
    <script>
      ['/_vercel/insights/script.js', '/_vercel/speed-insights/script.js'].forEach(src => {
        var s = document.createElement('script');
        s.defer = true;
        s.src = src;
        document.body.appendChild(s);
      });
    </script>
  </body>
</html>
